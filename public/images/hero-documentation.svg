<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14231B" />
      <stop offset="100%" stop-color="#092328" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2a1d" />
      <stop offset="100%" stop-color="#22160e" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6E9" />
      <stop offset="100%" stop-color="#EDE2CA" />
    </linearGradient>
    <linearGradient id="greenBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D6E3F" />
      <stop offset="100%" stop-color="#0A5A33" />
    </linearGradient>
  </defs>

  <!-- Background: Library Room -->
  <rect width="800" height="520" fill="url(#warmBg)" />

  <!-- Bookshelves in background -->
  <g opacity="0.18" stroke="#E3F0AF" stroke-width="2">
    <line x1="80" y1="60" x2="720" y2="60" />
    <line x1="80" y1="120" x2="720" y2="120" />
    <line x1="80" y1="180" x2="720" y2="180" />
    <!-- Book Spines -->
    <rect x="90" y="70" width="16" height="48" fill="#5DB996" />
    <rect x="110" y="65" width="22" height="53" fill="#EDE2CA" />
    <rect x="136" y="72" width="14" height="46" fill="#0D6E3F" />
    <rect x="154" y="68" width="18" height="50" fill="#E3F0AF" />
    <rect x="240" y="130" width="20" height="48" fill="#EDE2CA" />
    <rect x="264" y="125" width="26" height="53" fill="#5DB996" />
    <rect x="294" y="128" width="16" height="50" fill="#0D6E3F" />
    <rect x="520" y="70" width="24" height="48" fill="#EDE2CA" />
    <rect x="548" y="64" width="18" height="54" fill="#5DB996" />
    <rect x="570" y="68" width="22" height="50" fill="#0D6E3F" />
  </g>

  <!-- Wooden Discussion Table -->
  <polygon points="40,320 760,320 800,520 0,520" fill="url(#tableGrad)" />

  <!-- Table papers, documents, manuscripts -->
  <!-- Document 1: Left Angled -->
  <polygon points="120,350 260,330 290,450 150,470" fill="url(#paperGrad)" opacity="0.95" />
  <line x1="140" y1="365" x2="245" y2="350" stroke="#4A5D52" stroke-width="2" />
  <line x1="145" y1="385" x2="255" y2="370" stroke="#4A5D52" stroke-width="2" />
  <line x1="150" y1="405" x2="265" y2="390" stroke="#4A5D52" stroke-width="2" />
  <line x1="155" y1="425" x2="275" y2="410" stroke="#4A5D52" stroke-width="2" />

  <!-- Bound Volume / Book in Center -->
  <polygon points="320,360 480,360 490,470 310,470" fill="url(#greenBook)" />
  <polygon points="330,370 470,370 478,460 322,460" fill="url(#paperGrad)" />
  <line x1="400" y1="370" x2="400" y2="460" stroke="#3d2a1d" stroke-width="2" />
  <text x="345" y="415" font-family="serif" font-size="11" fill="#14231B" font-weight="bold">ARALING</text>
  <text x="340" y="430" font-family="serif" font-size="11" fill="#14231B" font-weight="bold">PANLIPUNAN</text>
  <text x="415" y="415" font-family="serif" font-size="11" fill="#14231B" font-weight="bold">KASAYSAYAN</text>
  <text x="415" y="430" font-family="serif" font-size="11" fill="#14231B" font-weight="bold">&amp; LIPUNAN</text>

  <!-- Document 2: Right Angled -->
  <polygon points="520,340 660,355 635,475 495,460" fill="url(#paperGrad)" opacity="0.95" />
  <line x1="535" y1="365" x2="640" y2="375" stroke="#4A5D52" stroke-width="2" />
  <line x1="530" y1="385" x2="635" y2="395" stroke="#4A5D52" stroke-width="2" />
  <line x1="525" y1="405" x2="630" y2="415" stroke="#4A5D52" stroke-width="2" />

  <!-- Silhouettes of Learners in Discussion around Table -->
  <!-- Learner 1: Left leaning forward -->
  <circle cx="210" cy="220" r="42" fill="#E3F0AF" opacity="0.8" />
  <path d="M140,320 C140,260 170,250 210,250 C250,250 280,260 280,320 Z" fill="#5DB996" opacity="0.85" />

  <!-- Learner 2: Center engaged in discussion -->
  <circle cx="390" cy="190" r="46" fill="#EDE2CA" opacity="0.85" />
  <path d="M310,320 C310,240 350,230 390,230 C430,230 470,240 470,320 Z" fill="#118B50" opacity="0.9" />

  <!-- Learner 3: Right taking notes -->
  <circle cx="580" cy="215" r="44" fill="#E3F0AF" opacity="0.8" />
  <path d="M510,320 C510,255 540,245 580,245 C620,245 650,255 650,320 Z" fill="#2A835F" opacity="0.85" />

  <!-- Academic Overlay Stamp -->
  <rect x="590" y="40" width="160" height="40" rx="4" fill="#0D6E3F" fill-opacity="0.8" stroke="#E3F0AF" stroke-width="1" />
  <text x="670" y="65" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="1">DOKUMENTASYON</text>
</svg>
